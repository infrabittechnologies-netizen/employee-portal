<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Access Only – Infrabit Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
    }
    .icon svg { width: 44px; height: 44px; stroke: #fff; }
    h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; letter-spacing: -0.02em; }
    p { font-size: 15px; line-height: 1.6; color: #94a3b8; margin-bottom: 8px; }
    .highlight { color: #c7d2fe; font-weight: 600; }
    .devices {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 28px 0 8px;
    }
    .device {
      flex: 1;
      max-width: 120px;
      padding: 16px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .device svg { width: 28px; height: 28px; stroke: #818cf8; margin-bottom: 8px; }
    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
    </div>
    <h1>Desktop Access Only</h1>
    <p>This portal is accessible <span class="highlight">only on a Laptop or Mac</span>.</p>
    <p>For security and office attendance, mobile and tablet access is not permitted.</p>

    <div class="devices">
      <div class="device">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
        </svg>
        Laptop
      </div>
      <div class="device">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="12" rx="1"></rect>
          <line x1="2" y1="20" x2="22" y2="20"></line>
        </svg>
        Mac
      </div>
    </div>

    <div class="footer">
      Please open <strong>portal.infrabit.tech</strong> on your office computer.
    </div>
  </div>
</body>
</html>
